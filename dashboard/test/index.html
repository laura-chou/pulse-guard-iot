<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Testing Tool - PulseGuard</title>
    <link rel="icon" type="image/png" href="../icon.png">
    <link rel="stylesheet" href="../styles.css">
    <script src="../lib/mqtt.min.js"></script>
    <style>
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }
        .header-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.25rem;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 5rem;
        }
        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .log-area {
            background: #000;
            color: #4ade80; /* neon-green */
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            padding: 1rem;
            height: 400px;
            overflow-y: auto;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            line-height: 1.5;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .card {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #manual-bpm,
        #manual-spo2 {
            width: 90%;
        }
    </style>
</head>
<body class="lang-en">
    <div class="test-container">
        <header>
            <div class="header-main">
                <h1 data-i18n="test.title">MQTT Testing Tool</h1>
            </div>
            <div class="header-status">
                <div id="connection-status" class="status-indicator" data-i18n="ui.conn_connecting">Connecting...</div>
            </div>
        </header>

        <main>
            <div class="grid-layout">
                <!-- Manual Section -->
                <div class="card">
                    <div class="card-header">
                        <h2 data-i18n="test.manual_send">MANUAL SEND</h2>
                    </div>

                    <div class="form-group">
                        <label data-i18n="test.device_id">Device ID</label>
                        <input type="text" id="device-id" value="MOCK_DEVICE_001" required>
                    </div>

                    <div class="form-group">
                        <label data-i18n="test.quick_presets">Quick Presets</label>
                        <select id="presetSelect">
                            <option value="" data-i18n="test.preset_placeholder">-- Select a preset... --</option>
                            <option value="normal" data-i18n="test.preset_normal">Normal (70 BPM, 98% SpO₂)</option>
                            <option value="low_spo2" data-i18n="test.preset_low_spo2">Low SpO₂ (75 BPM, 92% SpO₂)</option>
                            <option value="high_bpm" data-i18n="test.preset_high_bpm">High BPM (110 BPM, 97% SpO₂)</option>
                            <option value="severe_low_spo2" data-i18n="test.preset_severe_low_spo2">Severe Low SpO₂ (80 BPM, 85% SpO₂)</option>
                            <option value="acute_tachycardia" data-i18n="test.preset_acute_tachycardia">Acute Tachycardia (140 BPM, 96% SpO₂)</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>BPM</label>
                            <input type="number" id="manual-bpm" value="70">
                        </div>
                        <div class="form-group">
                            <label>SpO₂ (%)</label>
                            <input type="number" id="manual-spo2" value="98">
                        </div>
                    </div>

                    <div class="btn-group">
                        <button class="primary" id="sendManualBtn" style="flex: 1;" data-i18n="test.send_single">Send Single</button>
                        <button id="autoSendBtn" class="warning" style="flex: 1;" data-i18n="test.start_auto">Start Auto (1s)</button>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label data-i18n="test.duration">Duration (sec)</label>
                            <input type="number" id="manual-duration" value="30">
                        </div>
                    </div>

                    <div class="btn-group">
                        <button id="sendCompletedBtn" class="primary" style="flex: 1;" data-i18n="test.send_completed">Send Completed</button>
                        <button id="sendResetBtn" class="danger" style="flex: 1;" data-i18n="test.send_reset">Send Reset</button>
                    </div>
                </div>

                <!-- Scenarios Section -->
                <div class="card">
                    <div class="card-header">
                        <h2 data-i18n="test.scenarios">TEST SCENARIOS</h2>
                    </div>

                    <div class="form-group">
                        <label data-i18n="test.select_scenario_label">Select Scenario</label>
                        <select id="scenarioSelect">
                            <option value="" data-i18n="test.scenario_placeholder">-- Select a scenario... --</option>
                            <option value="A" data-i18n="test.scenario_a">Scenario A: First Valid Write Test</option>
                            <option value="B" data-i18n="test.scenario_b">Scenario B: Anomaly Filtering</option>
                            <option value="C" data-i18n="test.scenario_c">Scenario C: SpO2 Drop Zero-Latency Write</option>
                            <option value="D" data-i18n="test.scenario_d">Scenario D: Acute BPM Surge (ΔBPM)</option>
                            <option value="E" data-i18n="test.scenario_e">Scenario E: Timer Interception Test</option>
                            <option value="F" data-i18n="test.scenario_f">Scenario F: 5s Stabilization Warm-up</option>
                        </select>
                    </div>

                    <div id="scenarioDescription" style="font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4; min-height: 4em; margin-bottom: 1rem;">
                        <div id="desc-text" data-i18n="test.select_scenario_help">Please select a scenario to see details.</div>
                    </div>

                    <div class="btn-group">
                        <button class="primary" id="executeScenarioBtn" style="width: 100%; justify-content: center;" data-i18n="test.execute_scenario">Execute Scenario</button>
                    </div>
                </div>
            </div>

            <!-- Log Section -->
            <div class="log-container">
                    <div class="log-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                        <h2 style="margin: 0; font-size: 1.3rem; color: var(--text-secondary); text-transform: uppercase;" data-i18n="test.message_log">MESSAGE LOG</h2>
                        <div style="display: flex; gap: 0.5rem;">
                            <a href="monitor.html" target="_blank" id="monitorLink">
                                <button class="primary" style="font-size: 0.9rem; padding: 0.5rem 0.8rem;" data-i18n="test.open_monitor">Open Monitor</button>
                            </a>
                            <button id="clearLogBtn" style="font-size: 0.9rem; padding: 0.5rem 0.8rem;" data-i18n="test.clear_log">Clear Log</button>
                        </div>
                </div>
                <div id="log" class="log-area"></div>
            </div>
        </main>
    </div>

    <script type="module" src="/test/test-logic.js"></script>
</body>
</html>
